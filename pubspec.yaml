name: silence_speedup
description: "Speed up your videos by speeding up (or removing) silences, using FFmpeg."
publish_to: 'none'

# Flutter port of the Electron app (padvincenzo/silence-speedup v2.0.0).
# Stays below 1.0 until the demo player lands — see ROADMAP.md.
version: 0.9.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # FFmpeg is bundled by the plugin: no binary to ship, no path to configure.
  # Full-GPL build (includes libx264) covering Windows, Android, macOS, iOS and Linux.
  ffmpeg_kit_flutter_new: ^4.6.2

  cupertino_icons: ^1.0.8
  desktop_drop: ^0.8.4
  file_picker: ^12.2.0
  http: ^1.6.0
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/locales/
    - assets/icons/
